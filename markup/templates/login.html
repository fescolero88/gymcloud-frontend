<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GymCloud</title>
    <link href="../static/vendor/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/vendor/css/font-awesome.min.css" rel="stylesheet">
    <link href="../static/css/login.css" rel="stylesheet">
    <script src="../static/vendor/js/jquery-1.11.1.min.js"></script>
    <script src="../static/vendor/js/bootstrap.min.js"></script>
  </head>

  <body>
    <header class="gc-header-standard gc-header-login">
      <div class="container">
        <div class="col-xs-12 col-sm-6 gc-login-form-wrapper">
          <h1 class="text-center">Sign In to your account</h1>
          <form role="form">
            <div class="form-group row gc-login-social">
              <div class="col-xs-12 col-md-6 text-xs-center text-md-left">
                <a class="btn btn-primary" href="#">
                  <i class="fa fa-facebook"></i>
                  Log in with Facebook
                </a>
              </div>
              <div class="col-xs-12 col-md-6 text-xs-center text-md-right">
                <a class="btn btn-danger" href="#">
                  <i class="fa fa-google-plus"></i>
                  Log in with Google+
                </a>
              </div>
            </div>
            <div class="form-group">
              <label for="exampleInputEmail1">Email address</label>
              <input type="email" class="form-control" id="exampleInputEmail1" placeholder="Enter email">
            </div>
            <div class="form-group">
              <label for="exampleInputPassword1">Password</label>
              <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">
            </div>
            <div class="form-group row">
              <div class="col-xs-6">
                <div class="checkbox">
                  <label>
                    <input type="checkbox"> Remember Me
                  </label>
                </div>
              </div>
              <div class="col-xs-6 text-right">
                <button type="submit" class="btn btn-default">Log in</button>
              </div>
            </div>
          </form>
          <p class="gc-login-signup-wrapper text-center">
            Don't have an account? <a href="#">Sign up</a>
          </p>
        </div>
      </div>
    </header>
  </body>
</html>
